services:

  app:
    build: .
    container_name: cauldron-app

    ports:
      - "8008:8000"

    labels:
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/wizaarddlabs/cauldron/main/cauldron-removebg-preview.png"

    volumes:
      - ./app:/srv/app
      - ./data:/data

    environment:
      - REDIS_URL=redis://redis:6379/0
      - ADDON_URL=${ADDON_URL:-http://localhost:8000}
      - ZILEAN_ENABLED=${ZILEAN_ENABLED:-false}
      - ZILEAN_URL=${ZILEAN_URL:-http://zilean:8181}

    restart: unless-stopped


  redis:
    image: redis:7-alpine
    container_name: cauldron-redis

    ports:
      - "6380:6379"

    command: >
      sh -c "redis-server --maxmemory ${REDIS_MAX_MEMORY:-512mb} --maxmemory-policy ${REDIS_EVICTION_POLICY:-allkeys-lru}"

    restart: unless-stopped

  zilean:
    image: ipromknight/zilean:latest
    container_name: cauldron-zilean
    labels:
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/selfhosters/unraid-templates/master/templates/icons/zilean.png"
    restart: unless-stopped
    environment:
      Zilean__Database__ConnectionString: "Host=zilean-postgres;Port=5432;Database=zilean;Username=zilean;Password=${ZILEAN_POSTGRES_PASSWORD}"
      Zilean__Dmm__EnableScraping: "true"
      Zilean__Dmm__EnableEndpoint: "true"
      Zilean__Dmm__ImportBatched: "true"
      Zilean__Dmm__MaxFilteredResults: "200"
      Zilean__Imdb__EnableImportMatching: "true"
    depends_on:
      zilean-postgres:
        condition: service_healthy

  zilean-postgres:
    image: postgres:16-alpine
    container_name: cauldron-zilean-postgres
    labels:
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/linuxserver/docker-templates/master/templates/icons/zilean.png"
    restart: unless-stopped
    environment:
      POSTGRES_DB: zilean
      POSTGRES_USER: zilean
      POSTGRES_PASSWORD: ${ZILEAN_POSTGRES_PASSWORD}
    volumes:
      - ./data/zilean-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zilean -d zilean"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  zilean-postgres-data:
