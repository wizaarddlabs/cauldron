services:
  app:
    container_name: cauldron
    build: .
    ports:
      - "127.0.0.1:8008:8000"
    volumes:
      - ./app:/srv/app
      - ./data:/data
    environment:
      REDIS_URL: redis://redis:6379/0
      ADDON_URL: https://cauldron.forthewizards.uk
      ZILEAN_ENABLED: "${ZILEAN_ENABLED:-false}"
      ZILEAN_URL: ${ZILEAN_URL:-http://zilean:8181}
      TORRIN_API_KEY: ${TORRIN_API_KEY}
    restart: always
    networks:
      - cauldron-network
      - npm_default
    depends_on:
      redis:
        condition: service_healthy

  redis:
    container_name: cauldron-redis
    image: redis:7-alpine
    command: >
      sh -c "redis-server
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
      --maxmemory-policy ${REDIS_EVICTION_POLICY:-allkeys-lru}"
    restart: always
    networks:
      - cauldron-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  zilean:
    container_name: cauldron-zilean
    build:
      context: ./zilean
      dockerfile: Dockerfile
    image: cauldron-zilean:latest
    restart: always
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8181/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    environment:
      POSTGRES_PASSWORD: ${ZILEAN_POSTGRES_PASSWORD}

      # ASP.NET
      ASPNETCORE_URLS: http://+:8181
      ASPNETCORE_HTTP_PORTS: "8181"

      # Zilean database
      Zilean__Database__ConnectionString: >-
        Host=zilean-postgres;
        Port=5432;
        Database=zilean;
        Username=zilean;
        Password=${ZILEAN_POSTGRES_PASSWORD}

      # Dashboard
      Zilean__EnableDashboard: "true"

      # DMM Hashlists
      Zilean__Dmm__EnableScraping: "true"
      Zilean__Dmm__EnableEndpoint: "true"
      Zilean__Dmm__ImportBatched: "true"
      Zilean__Dmm__MaxFilteredResults: "200"

      # Torznab
      Zilean__Torznab__EnableEndpoint: "true"

      # IMDb
      Zilean__Imdb__EnableImportMatching: "true"

      # GitHub authentication for DMM Hashlists
      GITHUB_TOKEN: ${GITHUB_TOKEN}

    networks:
      - cauldron-network

  zilean-postgres:
    container_name: cauldron-postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: zilean
      POSTGRES_USER: zilean
      POSTGRES_PASSWORD: ${ZILEAN_POSTGRES_PASSWORD}
    volumes:
      - ./data/zilean-postgres:/var/lib/postgresql/data
    networks:
      - cauldron-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U zilean -d zilean
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redis-data:

networks:
  cauldron-network:
    driver: bridge
  npm_default:
    external: true