services:

  app:
    build: .
    container_name: cauldron-app

    ports:
      - "8008:8000"

    labels:
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/wizaarddlabs/cauldron/main/cauldron-removebg-preview.png"

    volumes:
      - ./app:/srv/app
      - ./data:/data

    environment:
      - REDIS_URL=redis://redis:6379/0
      - ADDON_URL=${ADDON_URL:-http://localhost:8000}
      - ADDON_URL=${ADDON_URL:-http://localhost:8000}

    depends_on:
      - redis

    restart: unless-stopped


  redis:
    image: redis:7-alpine
    container_name: cauldron-redis

    command: >
      sh -c "redis-server --maxmemory ${REDIS_MAX_MEMORY:-512mb} --maxmemory-policy ${REDIS_EVICTION_POLICY:-allkeys-lru}"

    restart: unless-stopped
